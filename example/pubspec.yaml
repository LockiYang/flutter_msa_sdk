name: flutter_msa_sdk_example
description: Demonstrates how to use the flutter_msa_sdk plugin.
publish_to: "none"

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_msa_sdk:
    path: ../
    
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

